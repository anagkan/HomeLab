services:
  sparkyfitness-db:
    image: postgres:18.3-alpine
    container_name: sparkyfitness-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SPARKY_FITNESS_DB_NAME}
      POSTGRES_USER: ${SPARKY_FITNESS_DB_USER}
      POSTGRES_PASSWORD: ${SPARKY_FITNESS_DB_PASSWORD}
      PUID: 1000
      GUID: 1000
    volumes:
      - ./postgresql:/var/lib/postgresql
    networks:
      - sparkyfitness   # internal only - not exposed to Traefik

  sparkyfitness-server:
    image: codewithcj/sparkyfitness_server:latest
    container_name: sparkyfitness-server
    restart: unless-stopped
    depends_on:
      - sparkyfitness-db
    environment:
      SPARKY_FITNESS_LOG_LEVEL: ${SPARKY_FITNESS_LOG_LEVEL:-ERROR}
      ALLOW_PRIVATE_NETWORK_CORS: ${ALLOW_PRIVATE_NETWORK_CORS:-false}
      SPARKY_FITNESS_EXTRA_TRUSTED_ORIGINS: ${SPARKY_FITNESS_EXTRA_TRUSTED_ORIGINS:-}
      SPARKY_FITNESS_PUBLIC_API_DOCS: ${SPARKY_FITNESS_PUBLIC_API_DOCS:-false}
      SPARKY_FITNESS_DB_USER: ${SPARKY_FITNESS_DB_USER}
      SPARKY_FITNESS_DB_HOST: sparkyfitness-db
      SPARKY_FITNESS_DB_NAME: ${SPARKY_FITNESS_DB_NAME}
      SPARKY_FITNESS_DB_PASSWORD: ${SPARKY_FITNESS_DB_PASSWORD}
      SPARKY_FITNESS_DB_PORT: 5432
      SPARKY_FITNESS_APP_DB_USER: ${SPARKY_FITNESS_APP_DB_USER}
      SPARKY_FITNESS_APP_DB_PASSWORD: ${SPARKY_FITNESS_APP_DB_PASSWORD}
      SPARKY_FITNESS_API_ENCRYPTION_KEY: ${SPARKY_FITNESS_API_ENCRYPTION_KEY}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      SPARKY_FITNESS_FRONTEND_URL: https://sparkyfitness.${DOMAIN}
      SPARKY_FITNESS_DISABLE_SIGNUP: ${SPARKY_FITNESS_DISABLE_SIGNUP:-false}
      SPARKY_FITNESS_ADMIN_EMAIL: ${SPARKY_FITNESS_ADMIN_EMAIL:-}
      # Garmin Connect sync is delegated to the sparkyfitness-garmin microservice.
      # Disabled for now in favor of the Health Connect path (mobile app). Re-enable
      # together with the sparkyfitness-garmin container below.
      # GARMIN_MICROSERVICE_URL: http://sparkyfitness-garmin:8000
      # --- OIDC single sign-on via Authelia ---
      SPARKY_FITNESS_OIDC_AUTH_ENABLED: ${SPARKY_FITNESS_OIDC_AUTH_ENABLED:-true}
      SPARKY_FITNESS_OIDC_PROVIDER_SLUG: ${SPARKY_FITNESS_OIDC_PROVIDER_SLUG:-authelia}
      SPARKY_FITNESS_OIDC_PROVIDER_NAME: ${SPARKY_FITNESS_OIDC_PROVIDER_NAME:-Authelia}
      SPARKY_FITNESS_OIDC_ISSUER_URL: https://auth.${DOMAIN}
      SPARKY_FITNESS_OIDC_CLIENT_ID: ${SPARKY_FITNESS_OIDC_CLIENT_ID:-sparkyfitness}
      SPARKY_FITNESS_OIDC_CLIENT_SECRET: ${SPARKY_FITNESS_OIDC_CLIENT_SECRET}
      SPARKY_FITNESS_OIDC_SCOPE: ${SPARKY_FITNESS_OIDC_SCOPE:-openid email profile groups}
      SPARKY_FITNESS_OIDC_ADMIN_GROUP: ${SPARKY_FITNESS_OIDC_ADMIN_GROUP:-admins}
      SPARKY_FITNESS_OIDC_AUTO_REGISTER: ${SPARKY_FITNESS_OIDC_AUTO_REGISTER:-true}
      # Fail-safe: keep email/password login available during rollout.
      # Set to false once OIDC login is confirmed working.
      SPARKY_FITNESS_FORCE_EMAIL_LOGIN: ${SPARKY_FITNESS_FORCE_EMAIL_LOGIN:-true}
      TZ: America/New_York
      NODE_ENV: production
      PUID: 1000
      GUID: 1000
    volumes:
      - ./backup:/app/SparkyFitnessServer/backup
      - ./uploads:/app/SparkyFitnessServer/uploads
    networks:
      - sparkyfitness   # internal only - reached by the frontend's nginx proxy

  sparkyfitness-frontend:
    image: codewithcj/sparkyfitness:latest
    container_name: sparkyfitness-frontend
    restart: unless-stopped
    depends_on:
      - sparkyfitness-server
    environment:
      SPARKY_FITNESS_FRONTEND_URL: https://sparkyfitness.${DOMAIN}
      SPARKY_FITNESS_SERVER_HOST: sparkyfitness-server
      SPARKY_FITNESS_SERVER_PORT: 3010
      PUID: 1000
      GUID: 1000
    networks:
      - sparkyfitness   # to reach the backend server
      - proxy           # to be routed by Traefik

    labels:
      # Traefik
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.sparkyfitness.rule=Host(`sparkyfitness.${DOMAIN}`)"
      - "traefik.http.routers.sparkyfitness.entrypoints=websecure"
      - "traefik.http.routers.sparkyfitness.tls=true"
      - "traefik.http.routers.sparkyfitness.tls.certresolver=${CERTRESOLVER}"
      - "traefik.http.services.sparkyfitness.loadbalancer.server.port=80"
      - "traefik.http.routers.sparkyfitness.tls.domains[0].main=${DOMAIN}"
      - "traefik.http.routers.sparkyfitness.tls.domains[0].sans=*.${DOMAIN}"

      # NOTE: No Authelia forward-auth middleware here on purpose.
      # SparkyFitness authenticates users directly against Authelia via OIDC
      # (single sign-on), so a forward-auth gate would double-prompt for login.
      # Authelia is registered as the OIDC provider in authelia/configuration.yaml.

  # Garmin Connect integration. The server (GARMIN_MICROSERVICE_URL) calls this
  # FastAPI microservice, which logs into Garmin and pulls activity/body data.
  # Internal only - never exposed to Traefik; no auth of its own.
  #
  # DISABLED for now: it requires handing your full Garmin password to the server,
  # and upstream still flags it work-in-progress. Using the Health Connect path
  # (SparkyFitnessMobile app) instead. To re-enable, uncomment this block AND the
  # GARMIN_MICROSERVICE_URL env var on sparkyfitness-server above.
  #
  # sparkyfitness-garmin:
  #   image: codewithcj/sparkyfitness_garmin:latest
  #   container_name: sparkyfitness-garmin
  #   restart: unless-stopped
  #   depends_on:
  #     - sparkyfitness-db
  #     - sparkyfitness-server
  #   environment:
  #     GARMIN_SERVICE_PORT: 8000
  #     GARMIN_SERVICE_IS_CN: "false"   # true only for Garmin China region
  #     TZ: America/New_York
  #     PUID: 1000
  #     GUID: 1000
  #   networks:
  #     - sparkyfitness   # internal only - reached by the server

networks:
  sparkyfitness:
    driver: bridge
  proxy:
    external: true
