services:
  technitium:
    image: technitium/dns-server:latest
    container_name: technitium
    restart: unless-stopped
    ports:
      # Bound to this node's Tailscale IP (set TAILSCALE_IP in .env) so DNS is
      # reachable only over the tailnet, never the public interface.
      - "${TAILSCALE_IP}:53:53/udp"
      - "${TAILSCALE_IP}:53:53/tcp"
      - "${TAILSCALE_IP}:5380:5380/tcp"
    environment:
      - TZ=America/New_York
      - DNS_SERVER_DOMAIN=technitium
    volumes:
      - ./config:/etc/dns
