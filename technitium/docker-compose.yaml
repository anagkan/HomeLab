services:
  technitium:
    image: technitium/dns-server:latest
    container_name: technitium
    restart: unless-stopped
    ports:
      # Bound to this VPS's Tailscale IP so DNS is reachable only over the tailnet.
      # NOTE: this IP is specific to the `technitium` Oracle node.
      - "100.118.88.67:53:53/udp"
      - "100.118.88.67:53:53/tcp"
      - "100.118.88.67:5380:5380/tcp"
    environment:
      - TZ=America/New_York
      - DNS_SERVER_DOMAIN=technitium
    volumes:
      - ./config:/etc/dns
