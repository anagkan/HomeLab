services:
    vikunja:
      image: vikunja/vikunja:latest
      container_name: vikunja
      restart: unless-stopped

      environment:
        VIKUNJA_SERVICE_PUBLICURL: https://vikunja.${DOMAIN}
        VIKUNJA_SERVICE_JWTSECRET: ${VIKUNJA_JWT_SECRET}
        VIKUNJA_SERVICE_ENABLEREGISTRATION: "false"  # OIDC auto-creates users; login page is publicly reachable
        VIKUNJA_DATABASE_TYPE: sqlite
        VIKUNJA_DATABASE_PATH: /app/vikunja/files/vikunja.db
      
      volumes:
        - ./files:/app/vikunja/files
        # OIDC provider config — must be a file, env vars alone won't register it
        - ./config.yaml:/app/vikunja/config.yaml:ro
      
      networks:
        - proxy
      
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=proxy"
        - "traefik.http.routers.vikunja.rule=Host(`vikunja.${DOMAIN}`)"
        - "traefik.http.routers.vikunja.entrypoints=websecure"
        - "traefik.http.routers.vikunja.tls=true"
        - "traefik.http.routers.vikunja.tls.certresolver=${CERTRESOLVER}"
        - "traefik.http.services.vikunja.loadbalancer.server.port=3456"
        - "traefik.http.routers.vikunja.tls.domains[0].main=${DOMAIN}"
        - "traefik.http.routers.vikunja.tls.domains[0].sans=*.${DOMAIN}"

        # No Authelia forward-auth middleware: Vikunja authenticates via Authelia
        # OIDC itself (see config.yaml). A single router serves the UI, /api, /dav,
        # and the /auth/openid/authelia callback. CalDAV/native apps use Vikunja's
        # own login/API tokens.


networks:
    proxy:
        external: true
